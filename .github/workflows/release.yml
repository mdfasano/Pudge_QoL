name: Release AddOn

# Runs when a tag is pushed, e.g. v1.17
on:
  push:
    tags:
      - '**'

env:
  # Only the GitHub release is used. Other sites are skipped because no tokens are set.
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
